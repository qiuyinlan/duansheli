name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:

# 允许写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消正在排队的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        # 云端同步的两个值从仓库 Secrets 来（Settings → Secrets and variables → Actions）。
        # Vite 只把 VITE_ 开头的变量打进了前端，所以这两个值在构建时就固定进产物里了
        # —— 换 Supabase 项目要重新部署一次，而不是改了就生效。
        #
        # 没配 Secrets 也不会失败：构建照常，只是产出的应用里云端同步整体关掉
        # （设置页会说明怎么配）。本地功能和以前一模一样。
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # 构建通过之后才跑测试；测试里包含「导出 → 导入 数据一致」这条硬门禁
      - name: 运行测试
        run: npm test

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
